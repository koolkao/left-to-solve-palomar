      Corollary 1.3 (6)
    lean: FeigeSamuels.feige_general_delta
    module: Challenge
    status: proved
    note: >-
      The source repository's
      OMA.S_opg_sums_of_independent_random_variables_with_unbounded_variance.main (the Left to Solve statement
      of PR #590), with Ω in an arbitrary universe instead of Type and the hypotheses as named binders (after
      review); proved by main_univ in Feige/MainUniv.lean, whose proof is that of main, copied.
  - source: Ling, Theorem 1.1, lower bound (Samuels' conjecture)
    lean: FeigeSamuels.samuels_lower
    module: Challenge
    status: proved
    note: Same statement as the source repository's Samuels.samuels_lower, with Samuels.qS written out.
