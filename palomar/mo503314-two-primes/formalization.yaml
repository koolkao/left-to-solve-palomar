# formalization.yaml v0.4.
version: v0.4
project:
  name: The odd-d conjecture of MathOverflow 503314 on products over powers of a root of unity
  description: Lean 4 proof that for coprime m, d with d odd, and integers r1, r2 of multiplicative order exactly
    d modulo m with gcd(r_i - 1, m) = 1, if prod_{u=1}^{d-1} (xi^k - xi^{k r1^u})(xi^k - xi^{-k r1^u}) = prod_{u=1}^{d-1}
    (xi^k - xi^{k r2^u})(xi^k - xi^{-k r2^u}) for all integers k, where xi = exp(2 pi i/m), then r1^c = r2 mod m
    for some c, that is, r1 and r2 generate the same subgroup of (Z/m)^x. This proves the conjecture of MathOverflow
    question 503314 for every odd d and every m; the cases d an odd prime (Ikeda 1980) and (Z/m)^x cyclic (Colantonio
    and Lauret) were known. The identity comes from the spectra of lens spaces.
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
classification:
  arxiv:
  - math.NT
  - math.SP
  msc2020:
  - 11R18
  - 11L03
  - 58J53
