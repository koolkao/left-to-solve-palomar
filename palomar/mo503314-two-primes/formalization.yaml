fidelity:
  divergences: xi^a is written cexp (2 * pi * I * a / m) with the real pi (open Real); the exponents k r^u are integers
    cast to C. The product runs over u in Finset.Icc 1 (d - 1). The conclusion is stated in ZMod m. m > 0 and gcd(m,
    d) = 1 are hypotheses as in the question; gcd(r2 - 1, m) = 1 is assumed as in the question although the proof
    may not need it.
