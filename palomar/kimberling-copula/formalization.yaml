fidelity:
  divergences: >-
    The question's "f from [0, ∞] onto [0, 1]" is read as f(0) = 1, f continuous on [0, ∞) and f(x) → 0
    as x → ∞ (f(∞) = 0), the standard inverse of a strict Archimedean generator; the docstring explains why
    the swapped assignment is excluded and that no generality is lost. Complete monotonicity is C^∞ on (0, ∞)
    with (−1)^k f^(k) ≥ 0 for all k ≥ 0 (Widder). g(0) = ∞ is encoded by archC = 0 when u = 0 or v = 0.
