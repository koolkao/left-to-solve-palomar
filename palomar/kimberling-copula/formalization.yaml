status:
  scope: >-
    Theorem 1 of the source note, exactly the Left to Solve statement mo-195959: for every f continuous on
    [0, ∞) with f(0) = 1, f → 0 at ∞ and completely monotone on (0, ∞), and all u, v ∈ [0, 1],
    archC f u v − uv ≤ archC f a a − a² with a = (u + v)/2. Theorem 2 of the note (the strengthening to
    log-convex −f′, Schur-concavity) and the counterexamples of its §3b are on paper only and not claimed. The
    solution uses no axioms beyond propext, Classical.choice and Quot.sound; the only sorry is the deliberate
    one in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
