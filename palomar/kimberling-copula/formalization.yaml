# formalization.yaml v0.4.
version: v0.4
project:
  name: Kimberling's inequality C(a, a) − a² ≥ C(u, v) − uv for Archimedean copulas with completely monotone
    generators (MathOverflow 195959)
  description: >-
    Lean 4 proof that for f continuous on [0, ∞), f(0) = 1, f(x) → 0 as x → ∞ and f completely monotone on
    (0, ∞), the Archimedean copula C(u, v) = f(g(u) + g(v)) (g the inverse of f; C = 0 if u = 0 or v = 0)
    satisfies C(a, a) − a² ≥ C(u, v) − uv with a = (u + v)/2 for all u, v ∈ [0, 1]. This answers Clark
    Kimberling's MathOverflow question 195959 (2015), previously settled only for Clayton generators. By
    Bernstein's theorem each shift f(· + ε) is a Laplace transform; under the normalized measure C(u, v) − uv
    is a covariance and C(a, a) − a² a variance of exponentials, which a single-crossing (Karlin–Novikoff)
    argument compares; ε → 0 gives the inequality.
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
