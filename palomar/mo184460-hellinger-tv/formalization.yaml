version: v0.4
project:
  name: Hellinger distance <= total variation for truncated Gaussians (MathOverflow 184460)
  description: 'Lean 4 proof that for P = N(-mu, 1) and Q = N(mu, 1) truncated to an interval [a, b] (a < b), or
    to any interval of positive length, d_H^2(P,Q) <= d_H(P,Q) <= d_TV(P,Q) with d_TV = (1/2)||P - Q||_1 and d_H^2
    = (1/2)||sqrt P - sqrt Q||_2^2, strictly d_H < d_TV for mu != 0, which answers MathOverflow question 184460
    positively; and the inequality behind it: for a log-concave f >= 0 on R with f cosh integrable and integral
    of f sinh zero, (int f cosh)(int f cosh - int f) <= (int f |sinh|)^2, strictly for strictly log-concave f.'
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
classification:
  arxiv:
  - math.PR
  - math.ST
