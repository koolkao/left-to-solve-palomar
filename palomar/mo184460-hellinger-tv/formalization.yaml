fidelity:
  divergences: The densities are given by equations for P and Q; d_TV and d_H are written as integrals over R (Bochner
    integrals; Check.lean of the source shows the integrands are integrable and the truncated densities are probability
    densities for a < b). The question tacitly has a < b. Log-concavity is written as the indicator of an interval
    times exp of a concave function.
