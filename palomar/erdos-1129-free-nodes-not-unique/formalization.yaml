# formalization.yaml v0.4. Drafted owner fields are marked [DRAFT-OWNER]; judgment calls [OWNER-DECIDE]. Remove the markers after editing.
version: v0.4
project:
  name: Optimal interpolation nodes are not unique for n ≥ 3 (Erdős Problem 1129, variant)
  description: >-
    Lean 4 proof that for every n ≥ 3 the set of node sets -1 ≤ x₁ < … < xₙ ≤ 1 with minimal Lebesgue
    constant is uncountable (Rack and Vajda 2015, Theorem 2.5). The proof shows that a minimiser exists
    (continuity, compactness and blow-up of the Lebesgue constant as nodes collide), rescales it to a
    canonical minimiser, and shrinks it slightly.
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
classification:
  arxiv:
  - math.CA
  - math.NA
  msc2020:
  - 41A05
  - 41A44
sources:
- title: 'Optimal cubic Lagrange interpolation: Extremal node systems with minimal Lebesgue constant'
  authors:
  - H.-J. Rack
  - R. Vajda
  type: paper
  location: Stud. Univ. Babeş-Bolyai Math. 60 (2015), 151–171, Theorem 2.5
  relationship: formalizes
  note: >-
    Theorem 2.5 is the result proved here. formalizes: the Lean proof follows the argument of its proof
    (a minimiser exists by continuity and compactness, it rescales to a canonical minimiser, and slight
    shrinkings x*/τ stay optimal because L(±1) = 1 < Λ* for n ≥ 3).
  author_endorsement: n/a
- title: Erdős Problem 1129
  type: web discussion
  location: https://www.erdosproblems.com/1129
  relationship: background
  author_endorsement: n/a
- title: formal-conjectures statement Erdos1129.erdos_1129.variants.free_nodes_not_unique
  type: other
  id: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/1129.lean
  location: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/1129.lean
  relationship: background
  note: >-
    Source of the Lean statement (Apache-2.0). Challenge.lean copies this statement and the definitions
    it uses, with the changes listed under fidelity.divergences.
  license: Apache-2.0
  author_endorsement: not-contacted
related_formalizations:
- id: https://github.com/CollinYuanjieRen/awards/blob/791bf61df4366b60b6b47b9e062661ee65b3143b/submissions/jsp-000936-cyr/README.md
  relationship: independent
  note: C. Y. Ren's formalization of all optimal free nodes (cited by formal-conjectures), building on
    randyxian08's canonical case. Not used here.
status:
  scope: >-
    Exactly the formal-conjectures statement Erdos1129.erdos_1129.variants.free_nodes_not_unique at commit
    9097e2f. Problem 1129 itself (the description of all minimisers) is not claimed. The solution uses
    no axioms beyond propext, Classical.choice and Quot.sound; the only sorry is the deliberate one in
    Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: agent
    models:
    - Claude Opus 5.5
    framework: Claude Code
    tool_setup: >-
      Claude Code agents, directed by the owner, wrote the proof, the Lean v4.36.0 port and this metadata;
      the statement and its definitions are copied from formal-conjectures. The owner chose the problems.
      The original proof was checked by the Left to Solve CI (Lean v4.33.1, Mathlib 0df444a); the port
      was built locally with lake build and checked with lake comparator (Lean v4.36.0) on macOS with
      its bwrap sandbox disabled, since bwrap is Linux-only.
    cost:
      wall_time: 'a few hours of agent time (26 Nov 2026), plus about 2 h for the Lean v4.36 port of all entries [DRAFT-OWNER]'
      spend_usd: subscription-based
      hardware: local machine
    prompting_notes: >-
      Goal-level instructions only: the owner chose the problem source (Left to Solve), set the working rules (original proofs only, no unlicensed reuse, exact CI check before every submission, independent AI reviews before any public release) and asked the agents to prove open targets; the owner gave no mathematical hints for this proof. Agents brainstormed proof routes with other models (Claude Fable; Gemini 4 Neon) before formalizing. [DRAFT-OWNER]
  spend_usd: subscription-based
  notes: >-
    The proof was first merged on Left to Solve (PR #1047 <https://github.com/GuillaumeBAUD-coder/open-math-agents/pull/1047>),
    whose CI compiles each submission against formal-conjectures 9097e2f and rejects any axiom beyond
    propext, Classical.choice and Quot.sound. The agents then ported it to Lean v4.36.0 and the module
    system for this entry; the port changes no mathematics. The owner directed the work at the level of goals and policy (which problems, originality and licensing rules, publication rules) and did not write Lean. Correctness rests on machine checking: the Left to Solve CI (kernel check, standard axioms only) and, for this entry, Comparator. Statement faithfulness rests on the formal-conjectures statement, copied into Challenge.lean and compared with the source line by line, and on separate AI reviews (Astra 6.2 and Gemini 4 Neon) of this repository's licensing and provenance and of sample Challenge files. [DRAFT-OWNER: add anything you checked yourself]
