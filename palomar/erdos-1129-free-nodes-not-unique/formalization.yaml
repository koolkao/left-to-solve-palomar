  notes: >-
    lake comparator accepted Solution against Challenge locally (Lean kernel, NanoDa and con-ron, without
    the bwrap sandbox). The Challenge was compared line by line with the formal-conjectures source. No independent human mathematical review. The owner reviewed this metadata [DRAFT-OWNER: add any spot checks of the statement or proof that you did yourself].
