    which uses only Mathlib vocabulary with every notion written out and quotes the question, and on separate AI
    reviews of the source repository. The source repository also contains an independent restatement (Check.lean),
    which this Challenge follows.
fidelity:
  divergences: The question is about general random variables; the formalization treats finitely supported couplings,
    given as lists of atoms with weights (atoms may repeat), with E[Y | X] = X imposed fibrewise and mu as the fibrewise
    conditional mean. For the "only if" direction finite couplings suffice, so the characterisation is not weakened;
    the "if" direction for general couplings is a paper statement only. Theorem 1 and 2 assume f convex (as in the
    question) or continuous.
