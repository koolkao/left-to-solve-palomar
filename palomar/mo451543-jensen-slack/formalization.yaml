status:
  scope: Theorem 1 for convex and for continuous f (all finitely supported couplings), Theorem 2 for convex and
    for continuous f (independent additive noise), and the x^4 counterexample to the asker's conjecture. The differentiable
    form of Theorem 1, the measure-theoretic (non-finite) setting and the Gaussian follow-up of the source repository
    (v1.1) are not claimed here. The solution uses no axioms beyond propext, Classical.choice and Quot.sound; the
    only sorries are the deliberate ones in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
