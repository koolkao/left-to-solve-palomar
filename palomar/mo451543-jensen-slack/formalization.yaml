# formalization.yaml v0.4.
version: v0.4
project:
  name: Only quadratics compare the two Jensen slacks (MathOverflow 451543)
  description: 'Lean 4 proof that for finitely supported couplings (X, Y) with E[Y | X] = X and mu(Y) = E[X | Y],
    a convex (or continuous) f : R -> R satisfies E[f(X) - f(mu(Y))] <= E[f(Y) - f(X)] for every coupling iff f
    is a quadratic a t^2 + b t + c with a >= 0 (Theorem 1); the same characterisation holds for the smaller class
    Y = X + Z with Z independent of X and E Z = 0 (Theorem 2); and x^4, which is convex with convex second derivative,
    is a counterexample to the conjecture of the asker of MathOverflow question 451543.'
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
classification:
  arxiv:
  - math.PR
  - math.CA
