# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Fields marked OWNER need the responsible maintainer's own words.
version: v0.4
project:
  name: Erdős's bound Υ(x) < √n for the Lebesgue function of interpolation nodes (Erdős Problem 1130,
    variant)
  description: >-
    Lean 4 proof of Erdős's 1947 theorem that for any n ≥ 2 distinct interpolation nodes in [-1, 1] the
    smallest of the n + 1 local maxima of the Lebesgue function Σ|ℓₖ| (over the gaps between consecutive
    nodes and the endpoints ±1) is less than √n.
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
classification:
  arxiv:
  - math.CA
  - math.NA
  msc2020:
  - 41A05
  - 41A10
sources:
- title: Some remarks on polynomials
  authors:
  - P. Erdős
  type: paper
  id: doi:10.1090/S0002-9904-1947-08938-2
  location: Bull. Amer. Math. Soc. 53 (1947), 1169–1176, Theorem 2
  relationship: independently-proves
  note: >-
    Theorem 2 is the result proved here (for distinct nodes).
  author_endorsement: n/a
- title: Erdős Problem 1130
  type: web discussion
  location: https://www.erdosproblems.com/1130
  relationship: background
  author_endorsement: n/a
- title: formal-conjectures statement Erdos1130.erdos_1130.variants.erdos_sqrt
  type: other
  id: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/1130.lean
  location: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/1130.lean
  relationship: background
  note: >-
    Source of the Lean statement (Apache-2.0). Challenge.lean copies this statement and the definitions
    it uses, with the changes listed under fidelity.divergences.
  license: Apache-2.0
  author_endorsement: not-contacted
related_formalizations:
- id: https://github.com/TauCetiProject/TauCetiRoadmap (PolynomialInterpolationAndBestApproximation, §3.1
    and §3.3)
  relationship: other
  note: Roadmap targets for the Lebesgue function and the Chebyshev-root bound; not formalized there as
    of 27 Nov 2026.
status:
  scope: >-
    Exactly the formal-conjectures statement Erdos1130.erdos_1130.variants.erdos_sqrt at commit 9097e2f
    (distinct nodes, n ≥ 2). Problem 1130 itself (Υ ≪ log n, and the maximisers) is not claimed. The solution
    uses no axioms beyond propext, Classical.choice and Quot.sound; the only sorry is the deliberate one
    in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: agent
    models:
    - Claude Opus 5.5
    framework: Claude Code
    tool_setup: >-
      Claude Code agents, directed by the owner, wrote the proof, the Lean v4.36.0 port and this metadata;
      the statement and its definitions are copied from formal-conjectures. The owner chose the problems.
      The original proof was checked by the Left to Solve CI (Lean v4.33.1, Mathlib 0df444a); the port
      was built locally with lake build and checked with lake comparator (Lean v4.36.0) on macOS with
      its bwrap sandbox disabled, since bwrap is Linux-only.
    cost:
      wall_time: 'OWNER: approximate elapsed effort'
      spend_usd: subscription-based
      hardware: local machine
    prompting_notes: 'OWNER: representative prompting notes, or n/a'
  spend_usd: subscription-based
  notes: >-
    The proof was first merged on Left to Solve (PR #981 <https://github.com/GuillaumeBAUD-coder/open-math-agents/pull/981>),
    whose CI compiles each submission against formal-conjectures 9097e2f and rejects any axiom beyond
    propext, Classical.choice and Quot.sound. The agents then ported it to Lean v4.36.0 and the module
    system for this entry; the port changes no mathematics. OWNER: describe how you directed and checked
    the agents.
fidelity:
  divergences: >-
    In extendedNodes the index bound `by omega` is replaced by the term `Nat.sub_one_lt_of_le h.1 h.2`
    (same bound; by proof irrelevance the same function). A tactic proof inside a definition creates a
    module-private auxiliary declaration whose name contains the module name, which Comparator would see
    as a mismatch between the copies in Challenge and in the proof development. Otherwise the definitions
    are verbatim and the formal-conjectures attributes are omitted. Lean/Mathlib differ from formal-conjectures
    (v4.36.0 / fc4f59e instead of v4.33.1 / 0df444a).
review:
  status: self-assessed
  reviewers:
  - Astra 6.2 (OpenAI model, read-only review of Challenge faithfulness)
  - Gemini 4 Neon (Google model, read-only review of Challenge faithfulness)
  notes: >-
    lake comparator accepted Solution against Challenge locally (Lean kernel, NanoDa and con-ron, without
    the bwrap sandbox). The Challenge was compared line by line with the formal-conjectures source. Two
    model reviews (Astra 6.2, Gemini 4 Neon) checked the Challenge against formal-conjectures; their findings
    were addressed. No human mathematical review beyond the owner's. OWNER: confirm or extend.
alignment:
  namespace: Erdos1130
  statements:
  - source: Erdős 1947, Theorem 2 (as stated in formal-conjectures)
    lean: Erdos1130.erdos_1130.variants.erdos_sqrt
    module: Challenge
    status: proved
    note: >-
      Same declaration name and statement as formal-conjectures at 9097e2f.
acknowledgements: >-
  Mathlib; formal-conjectures (Google DeepMind, Apache-2.0) for the statement and definitions; Left to
  Solve (GuillaumeBAUD-coder/open-math-agents) for the CI that first checked the proof.
