status:
  scope: >-
    The conjecture as stated (finite, connected, vertex-transitive, even order; induced halves, nonempty and
    connected) is refuted by one graph on 28 vertices (not_equal_halves), and that graph has no vertex set A
    with G[A] ≅ G[Aᶜ] at all (exists_counterexample_28). The other seven counterexamples of the source
    repository, their exhaustive computer checks, and the facts that the graphs are not Cayley graphs and
    that the automorphism group has order 504 are not formalized. The solution uses no axioms beyond
    propext, Classical.choice and Quot.sound (ordinary `decide +kernel`, no native_decide); the only sorries
    are the deliberate ones in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: agent
    models:
    - Claude Opus 5.5
    framework: Claude Code
    tool_setup: >-
      Claude Code agents, directed by the owner, searched the Holt–Royle census with two independent programs
      (C and Python/networkx), found the counterexamples, wrote the Lean certificate, this Palomar port and this
      metadata. The certificate was checked with the Left to Solve checker locally (Lean v4.33.1); this entry
      was built with lake build (about 1 min, 5 GB) and checked with lake comparator (Lean kernel, NanoDa,
      con-ron; about 4–5 min, peak 8.4 GB) on macOS with its bwrap sandbox disabled, since bwrap is Linux-only.
    cost:
      wall_time: 'about one day of agent time (26–27 Nov 2026), plus about 1 h for this Palomar entry'
      spend_usd: subscription-based
      hardware: local machine
    prompting_notes: >-
      Goal-level instructions only: the owner chose the problem source (open conjectures listed on Left to
      Solve), set the working rules (original proofs, no unlicensed reuse, machine-checked proofs with the
      standard axioms only, independent AI reviews before any public release) and asked the agents to settle
      the conjecture; the owner gave no mathematical hints.
  spend_usd: subscription-based
  notes: >-
    The owner directed the work at the level of goals and policy (which problems, originality and licensing
    rules, publication rules) and did not write Lean or mathematics. Correctness rests on machine checking
    (lake build with the standard axioms only; Comparator for this entry). Statement faithfulness rests on the
    Challenge, which uses only Mathlib vocabulary (SimpleGraph, Connected, induce, ≃g) and restates the
    conjecture, and on separate AI reviews (Astra 6.2, Gemini 4 Neon) of the source repository and of this
    Challenge.
fidelity:
  divergences: >-
    Vertex-transitivity is written out as ∀ u v, ∃ φ : G ≃g G, φ u = v (the definition of the PR #337 file,
    unfolded). The partition is a set A and its complement; the vertex type ranges over Type (universe 0),
    as in PR #337, which is no restriction for a disproof. The halves are induced subgraphs, the reading of
    both the note and PR #337 (with non-induced halves every census counterexample would split, along a
    Hamiltonian path).
review:
