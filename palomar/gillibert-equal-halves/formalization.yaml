# formalization.yaml v0.4.
version: v0.4
project:
  name: Gillibert's Equal Halves conjecture is false (a non-Cayley vertex-transitive graph on 28 vertices)
  description: >-
    Lean 4 disproof of the Equal Halves conjecture of L. Gillibert (2026): every finite connected
    vertex-transitive graph of even order would have a partition V = A ⊔ B into nonempty sets with G[A] and
    G[B] connected and isomorphic (induced subgraphs). The counterexample is graph 2659 of the Holt–Royle
    census of vertex-transitive graphs on 28 vertices (9-regular, automorphism group of order 504, not a
    Cayley graph). The kernel checks that for no vertex set A are G[A] and G[Aᶜ] isomorphic: an isomorphism
    would give an involution preserving same-side degree, triangle and distance-two counts, and 15 tests on
    these statistics, evaluated on all 2-colourings up to the stabiliser of a vertex, rule this out.
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
