status:
  scope: >-
    Three statements: Friedan's inequality for all n and α ∈ [0, 1] (friedan_two), Theorem M for m distributions
    (friedan_multi) and Theorem R2, the two-point Rényi version for 0 < γ ≤ 2 log 2, γ ≠ 1, and all m
    (friedan_renyi_two_point). Not claimed: the quantum (non-commuting) version, which is a separate entry
    (palomar/friedan-quantum); Proposition R1 (failure of the Rényi analogue for γ > 1 in high dimension) and
    the two-point failure above 2 log 2, which are paper proofs. K > 0 is assumed, as the question requires.
    The solution uses no axioms beyond propext, Classical.choice and Quot.sound; the only sorries are the
    deliberate ones in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
