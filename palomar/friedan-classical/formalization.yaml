    Challenge, which uses only Mathlib vocabulary (Real.negMulLog, Real.rpow, Real.log) and quotes the
    question, and on separate AI reviews (Astra 6.2, Gemini 4 Neon) of the source repository (its reviews/ and
    REVIEW-RESPONSES.md) and of this Challenge.
fidelity:
  divergences: >-
    Probability vectors are written out (nonnegative entries summing to 1) on Fin n; H uses the natural
    logarithm and 0 log 0 = 0 (Real.negMulLog); powers are Real.rpow with 0^0 = 1, which matters only at weight
    0, where both sides are equal; K > 0 is assumed because the question says Z is a probability vector (K = 0
    only for disjoint supports). Theorem M and R2 are the authors' extensions, not part of the question.
