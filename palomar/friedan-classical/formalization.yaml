version: v0.4
project:
  name: Friedan's generalized entropy inequality α H(X) + (1 − α) H(Y) ≥ K² H(Z) for all n and α (MathOverflow
    138395), for m distributions, and its two-point Rényi version
  description: >-
    Lean 4 proof of the inequality asked about by Daniel Friedan on MathOverflow 138395: for probability vectors
    X, Y on n points, 0 ≤ α ≤ 1, zᵢ = Xᵢ^α Yᵢ^{1−α}, K = Σ zᵢ > 0 and Z = z/K, the Shannon entropies satisfy
    K² H(Z) ≤ α H(X) + (1 − α) H(Y). Also proved: Theorem M, the same inequality for m distributions with
    weights summing to 1 (zᵢ = ∏ⱼ Xⱼ(i)^{aⱼ}), and Theorem R2, the Rényi-entropy version on two points for every
    order 0 < γ ≤ 2 log 2, γ ≠ 1, and every m. The two-distribution proof is a descent on the size of the
    support with concavity arguments for four or more, three and two atoms; Theorem M follows by an index
    lemma for the Hessian of (Σ eˣⁱ)² H(softmax x) and a maximum principle on faces of the weight simplex.
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
