version: v0.4
project:
  name: tanh Y · tanh Z and tanh X are never stochastically ordered for mean = variance Gaussians (a negative
    answer to MathOverflow 505921)
  description: >-
    Lean 4 proof that for all gX, gY, gZ > 0, with X ~ N(gX, gX), Y ~ N(gY, gY), Z ~ N(gZ, gZ) and Y, Z
    independent, neither tanh Y · tanh Z nor tanh X stochastically dominates the other: the c.d.f.s of
    U = tanh X and V = tanh Y · tanh Z cross on (−1, 1). So the answer to MathOverflow question 505921
    (is there gX > 0 with tanh Y tanh Z ⪰_st tanh X?) is no for every gY, gZ > 0. Both laws satisfy the
    belief-propagation consistency (LLR symmetry) condition; two consistent laws that are stochastically
    ordered are equal; and the two laws differ near 0 (small-ball masses O(ε) for U, at least of order
    ε log(1/ε) for V).
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
