status:
  scope: >-
    The full negative answer: for all gX, gY, gZ > 0 and every realization with Y, Z independent (X arbitrary
    on the same space), the c.d.f.s of tanh X and tanh Y · tanh Z are not ordered in either direction, whether
    compared on (−1, 1) (mo505921_Ioo) or on ℝ (mo505921; mo505921_iIndep with joint independence); and the
    question as asked at the level of laws (no_gX_Ioo). Remark 1 of NOTE.md (the increasing concave order) is
    proved on paper only and is not claimed here. The solution uses no axioms beyond propext,
    Classical.choice and Quot.sound; the only sorries are the deliberate ones in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
