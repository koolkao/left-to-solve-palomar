fidelity:
  divergences: >-
    Mathlib has no stochastic order, so ⪰_st is written out as the pointwise comparison of c.d.f.s, which is
    the question's own definition. The Gaussian parameters are ℝ≥0 with g ≠ 0 (that is, g > 0). The
    random-variable theorems assume only that Y and Z are independent (weaker than the question's joint
    independence; mo505921_iIndep assumes joint independence). no_gX_Ioo takes the law of tanh Y · tanh Z under
    the product of the two Gaussian laws, which is the law of V for independent Y, Z.
