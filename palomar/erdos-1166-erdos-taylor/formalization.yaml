    framework: Claude Code
    tool_setup: >-
      Claude Code agents, directed by the owner, wrote the proof, the Lean v4.36.0 port and this metadata;
      the statement and its definitions are copied from formal-conjectures. The owner chose the problems.
      The original proof was checked by the Left to Solve CI (Lean v4.33.1, Mathlib 0df444a); the port
      was built locally with lake build and checked with lake comparator (Lean v4.36.0) on macOS with
      its bwrap sandbox disabled, since bwrap is Linux-only.
    cost:
      wall_time: 'about one day of agent time across four Left to Solve PRs (26 Nov 2026), plus about 2 h for the Lean v4.36 port of all entries'
      spend_usd: subscription-based
      hardware: local machine
    prompting_notes: >-
      Goal-level instructions only: the owner chose the problem source (Left to Solve), set the working rules (original proofs only, no unlicensed reuse, exact CI check before every submission, independent AI reviews before any public release) and asked the agents to prove the targets; the owner gave no mathematical hints for this proof. Agents brainstormed proof routes with other models (Claude Fable; Gemini 4 Neon) before formalizing.
  spend_usd: subscription-based
  notes: >-
    The proof was first merged on Left to Solve (PR #750 <https://github.com/GuillaumeBAUD-coder/open-math-agents/pull/750>,
    PR #909 <https://github.com/GuillaumeBAUD-coder/open-math-agents/pull/909>, PR #1067 <https://github.com/GuillaumeBAUD-coder/open-math-agents/pull/1067>,
    PR #1157 <https://github.com/GuillaumeBAUD-coder/open-math-agents/pull/1157>), whose CI compiles each
    submission against formal-conjectures 9097e2f and rejects any axiom beyond propext, Classical.choice
    and Quot.sound. The agents then ported it to Lean v4.36.0 and the module system for this entry; the
    port changes no mathematics. The owner directed the work at the level of goals and policy (which problems, originality and licensing rules, publication rules) and did not write Lean. Correctness rests on machine checking: the Left to Solve CI (kernel check, standard axioms only) and, for this entry, Comparator. Statement faithfulness rests on the formal-conjectures statement, copied into Challenge.lean and compared with the source line by line, and on separate AI reviews (Astra 6.2 and Gemini 4 Neon) of this repository's licensing and provenance and of sample Challenge files.
fidelity:
  divergences: >-
    In Mathlib v4.36, MeasureTheory.pdf.IsUniform X s P μ is HasLaw X μ[|s] P (AEMeasurable X P and map
    X P = μ[|s]); in Mathlib 0df444a it was map X P = μ[|s]. IsSimpleRandomWalkSteps also requires each
    step to be measurable, so the two readings of the hypothesis are equivalent. Otherwise the definitions
    are verbatim and the formal-conjectures attributes are omitted. Lean/Mathlib differ from formal-conjectures
    (v4.36.0 / fc4f59e instead of v4.33.1 / 0df444a).
review:
