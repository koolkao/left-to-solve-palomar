  location: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/1166.lean
  relationship: background
  note: >-
    Source of the Lean statement (Apache-2.0). Challenge.lean copies this statement and the definitions
    it uses, with the changes listed under fidelity.divergences.
  license: Apache-2.0
  author_endorsement: not-contacted
related_formalizations: []
status:
  scope: >-
    Exactly the formal-conjectures statement Erdos1166.erdos_1166.variants.erdos_taylor at commit 9097e2f
    (maxLocalTime counts the visit at time 0, and the bounds are stated with ε). The conjectured limit
    1/π (Dembo, Peres, Rosen and Zeitouni 2001) is not claimed. The solution uses no axioms beyond propext,
    Classical.choice and Quot.sound; the only sorry is the deliberate one in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
