# formalization.yaml v0.4.
version: v0.4
project:
  name: 'Erdős–Taylor theorem: the maximal local time of the planar simple random walk is of order (log
    n)² (Erdős Problem 1166, variant)'
  description: >-
    Lean 4 proof that for the simple random walk on ℤ², almost surely the maximal local time Tₙ up to
    time n satisfies 1/(4π) ≤ liminf Tₙ/(log n)² ≤ limsup Tₙ/(log n)² ≤ 1/π (Erdős and Taylor 1960). The
    development is elementary: block independence and the fixed-time Markov property, exact return counts
    by the 45° rotation and Wallis' product, renewal at the first return, last-exit decomposition, Borel–Cantelli
    along dyadic and geometric times.
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
classification:
  arxiv:
  - "math.PR"
  msc2020:
  - "60G50"
  - "60J55"
sources:
- title: Some problems concerning the structure of random walk paths
  authors:
  - P. Erdős
  - S. J. Taylor
  type: paper
  id: doi:10.1007/BF02020631
  location: Acta Math. Acad. Sci. Hungar. 11 (1960), 137–162, p. 162
  relationship: formalizes
  note: >-
    The bounds on p. 162 are the result proved here. formalizes: the Lean proof follows Erdős and Taylor's
    argument, made elementary: return probabilities and renewal for the Green function, a union bound
    over first visits with Borel–Cantelli for the upper bound, and the independent-blocks argument for
    the lower bound.
  author_endorsement: n/a
- title: Erdős Problem 1166
  type: web discussion
  location: https://www.erdosproblems.com/1166
  relationship: background
  author_endorsement: n/a
- title: formal-conjectures statement Erdos1166.erdos_1166.variants.erdos_taylor
  type: other
