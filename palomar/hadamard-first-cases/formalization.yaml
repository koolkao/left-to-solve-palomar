# formalization.yaml v0.4.
version: v0.4
project:
  name: Hadamard matrices exist in every order 4k ≤ 664 (Hadamard conjecture, first cases)
  description: >-
    Lean 4 proof that a Hadamard matrix of order 4k exists for every k ≤ 166, so the smallest order for
    which the Hadamard conjecture is open is at least 668. The proof formalizes Sylvester doubling, the
    Paley I and II constructions over finite fields, the Goethals–Seidel array over finite abelian groups
    and Spence's bordered array, and checks the published sequence data for the remaining orders by kernel
    computation (decide +kernel, no native_decide).
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
classification:
  arxiv:
  - "math.CO"
  msc2020:
  - "05B20"
  - "15B34"
sources:
- title: Existence of Hadamard matrices of all orders 4k ≤ 664 (known constructions and published sequence data)
  type: other
  relationship: formalizes
  note: >-
    formalizes: the Lean proof formalizes classical constructions (Sylvester doubling; Paley I and II;
    the Goethals–Seidel array; Cooper–Wallis; Spence's bordered array) and kernel-checks published
    sequence data. The data were taken as numbers from the tables compiled in SageMath (GPL-2.0-or-later
    code; no SageMath code is included) and re-checked by the Lean kernel. Data by order 4k: Williamson
    quadruples k = 13, 23, 25, 29 (Hall 1986) and 61 (London 2013); Đoković's skew supplementary
    difference sets k = 43 (1992b), 67, 113, 127, 163 (1992a), 39, 65, 93, 133 (1992c), 103, 151 (1994),
    109, 145 (2008), 73 (arXiv 2301.02751); T-sequences k = 47 (Cohen et al. 1989), 59 (Turyn sequences
    of length 15; Turyn 1974), 89 (TT(30), Best et al. 2013), 107 (TT(36), Kharaghani and Tayfeh-Rezaie
    2005); Cooper–Wallis products k = 85, 119, 153 (T-sequences of length 5, 7, 9 × Williamson order 17)
    and k = 81 (T-sequences of length 9 × Williamson order 9 over Z9 × Z9); Spence's construction
    (1975, Thm 3.3) for k = 101, 149. All other odd k use Paley I or II; even k use Sylvester doubling.
  author_endorsement: n/a
