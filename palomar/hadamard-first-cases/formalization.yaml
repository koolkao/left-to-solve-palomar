automation:
  methods:
  - method: agent
    models:
    - Claude Opus 5.5
    framework: Claude Code
    tool_setup: >-
      Claude Code agents, directed by the owner, wrote the proof, the Lean v4.36.0 port and this metadata;
      the statement and its definitions are copied from formal-conjectures. The owner chose the problems.
      The original proof was checked by the Left to Solve CI (Lean v4.33.1, Mathlib 0df444a); the port
      was built locally with lake build and checked with lake comparator (Lean v4.36.0) on macOS with
      its bwrap sandbox disabled, since bwrap is Linux-only.
    cost:
      wall_time: 'about 1.5 h of agent time for the proof (27 Nov 2026), plus about 2 h for the Lean v4.36 port of all entries'
      spend_usd: subscription-based
      hardware: local machine
    prompting_notes: >-
      Goal-level instructions only: the owner chose the problem source (Left to Solve), set the working rules (original proofs only, no unlicensed reuse, exact CI check before every submission, independent AI reviews before any public release) and asked the agents to prove the targets; the owner gave no mathematical hints for this proof. Agents brainstormed proof routes with other models (Claude Fable; Gemini 4 Neon) before formalizing.
  spend_usd: subscription-based
  notes: >-
    The proof was first merged on Left to Solve (PR #3464 <https://github.com/GuillaumeBAUD-coder/open-math-agents/pull/3464>),
    whose CI compiles each submission against formal-conjectures 9097e2f and rejects any axiom beyond
    propext, Classical.choice and Quot.sound. The agents then ported it to Lean v4.36.0 and the module
    system for this entry; the port changes no mathematics. The owner directed the work at the level of goals and policy (which problems, originality and licensing rules, publication rules) and did not write Lean. Correctness rests on machine checking: the Left to Solve CI (kernel check, standard axioms only) and, for this entry, Comparator. Statement faithfulness rests on the formal-conjectures statement, copied into Challenge.lean and compared with the source line by line, and on separate AI reviews (Astra 6.2 and Gemini 4 Neon) of this repository's licensing and provenance and of sample Challenge files.
fidelity:
  divergences: >-
    None in the statement. Challenge.lean copies the definitions verbatim; it adds the module header and
    public sections of the Lean module system, imports Mathlib instead of FormalConjecturesUtil, and omits
    the formal-conjectures attributes. Lean/Mathlib differ from formal-conjectures (v4.36.0 / fc4f59e
    instead of v4.33.1 / 0df444a).
review:
  status: self-assessed
  reviewers:
  - none
  notes: >-
    lake comparator accepted Solution against Challenge locally (Lean kernel, NanoDa and con-ron, without
    the bwrap sandbox). The Challenge was compared line by line with the formal-conjectures source. No independent human mathematical review. The owner reviewed and approved this metadata (the account of authorship, AI use and review status) on 27 Nov 2026; that was not a mathematical review.
