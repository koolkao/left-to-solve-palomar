fidelity:
  divergences: p ranges over the real interval [0, 1] (StrictAntiOn on Set.Icc 0 1) in the explicit forms, and over
    unitInterval in the measure forms; the measure forms use the product of the two binomial laws, which is the
    joint law of independent X, Y by prob_of_indep. The binomial probability C(k,x)(1-p)^x p^(k-x) is written with
    p as 1 - (1 - p).
