version: v0.4
project:
  name: P((1+g)X + lY > k) is strictly decreasing in p when 2l <= 1+g (MathOverflow 478827)
  description: Lean 4 proof that for independent X ~ Bin(k, 1-p) and Y ~ Bin(k, p), k >= 1, 0 < g < 1 and 0 < l
    <= (1+g)/2, f_k(p) = P((1+g)X + lY > k) is strictly decreasing in p on [0, 1], which answers MathOverflow question
    478827 (g, l in (0,1), g >= l) positively, both for the explicit binomial sum and for Mathlib's binomial measure;
    and that strict (even weak) decrease fails for k = 10, g = 1/7, l = 99/100, so the general claim (Fact 1 of
    Arigapudi, Heller and Schreiber, arXiv:2107.08423) does not hold for all g, l in (0,1).
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
