name = "friedan_quantum"
version = "1.0.0"
defaultTargets = ["FriedanQ", "FriedanMulti", "FriedanQM", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

# Mathlib at fc4f59e577 (tag v4.36.0). physlib (Apache-2.0) at edc607c is used by the proof only;
# Challenge.lean imports only Mathlib.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "edc607c2e6cbcc2f9c40c750e5c10a8490d32470"

[[lean_lib]]
name = "FriedanQ"

[[lean_lib]]
name = "FriedanMulti"

[[lean_lib]]
name = "FriedanQM"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
