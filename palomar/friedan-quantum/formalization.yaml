fidelity:
  divergences: >-
    Matrices are complex n × n (Fin n); matrix exponential, logarithm and real powers are Mathlib's continuous
    functional calculus cfc on Hermitian matrices (on a non-Hermitian argument cfc is 0, but every argument here
    is Hermitian); S(A) = −re tr(A log A) with Real.log 0 = 0, i.e. 0 log 0 = 0; M/K is written K⁻¹ • M. In
    friedan_question the weight a multiplies H₁, as in Friedan's H_α = (1 − α)H₀ + αH₁; n ≥ 1 is assumed
    ([NeZero n]). The density-matrix theorems take a on ρ and 1 − a on σ, as in QUANTUM.md.
