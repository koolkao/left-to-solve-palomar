status:
  scope: >-
    Six statements: Friedan's quantum question as posed (friedan_question), its version for m Hamiltonians
    (hamiltonians_multi), and the density-matrix inequality for the log-Euclidean mean of m faithful states
    (logEuclidean_multi), the α-z means of two positive semidefinite states for every z > 0 (alphaZ_psd; Petz
    and, after swapping the states, sandwiched are special cases), the Kubo–Ando mean of two faithful states
    (kuboAndo) and the multivariate product means of m + 1 faithful states (product_multi). Not claimed: the
    log-Euclidean and Kubo–Ando means of non-faithful states (Corollary B of QUANTUM.md) and the Karcher mean,
    which are paper proofs; K > 0 is not stated (it holds for the means of faithful states). The solution uses
    no axioms beyond propext, Classical.choice and Quot.sound (some physlib files contain sorry in
    declarations this entry does not use; #print axioms shows none); the only sorries in this entry are the
    deliberate ones in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
