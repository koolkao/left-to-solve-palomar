version: v0.4
project:
  name: Friedan's entropy inequality for non-commuting Hamiltonians (the quantum question of MathOverflow 138395),
    for m Hamiltonians and for other matrix geometric means
  description: >-
    Lean 4 proof that Friedan's entropy inequality holds without the assumption that the Hamiltonians commute,
    answering the quantum question of MathOverflow 138395: for Hermitian n × n matrices H₀, H₁ and 0 ≤ a ≤ 1,
    with Gibbs states ρ_H = e^{−H}/Z(H), von Neumann entropies S(H), H_a = (1 − a)H₀ + aH₁ and
    K = Z(H_a)/(Z(H₀)^{1−a} Z(H₁)^a), K² S(H_a) ≤ (1 − a) S(H₀) + a S(H₁). Also proved: the same for m
    Hamiltonians, and a S(ρ) + (1 − a) S(σ) ≥ K² S(M/K), K = tr M, for the log-Euclidean mean of m faithful
    states, the α-z means (positive semidefinite states, any z > 0), the Kubo–Ando mean and the multivariate
    product means. The proof bounds the spectrum of the mean by weak log-majorization (Ky Fan, Horn,
    Ando–Hiai), shows that g(x) = (Σ eˣⁱ)² H(softmax x) is increasing and Schur-convex, and reduces to the
    classical inequality at the aligned commuting pair.
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
