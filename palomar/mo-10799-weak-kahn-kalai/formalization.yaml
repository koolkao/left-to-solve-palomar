# formalization.yaml v0.4. Fields marked OWNER need the responsible maintainer's own words.
version: v0.4
project:
  name: 'Weak Kahn–Kalai theorem: monotone families are near-optimal for the edge isoperimetric inequality
    at some p (MathOverflow 10799, variant)'
  description: >-
    Lean 4 proof that for every ε > 0 there is C > 0 such that every monotone increasing family F of subsets
    of an n-element set (n ≥ 2) with critical probability t (μₜ(F) = 1/2) is (C log(1/p), p)-optimal for
    the p-biased edge isoperimetric inequality at some p in [n^(-ε) t, t]. The proof uses the Russo–Margulis
    formula and the Cauchy mean value theorem for -log(-log μₚ(F)) against log p.
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
classification:
  arxiv:
  - math.CO
  - math.PR
  msc2020:
