    Exactly the formal-conjectures statement Mathoverflow10799.mathoverflow_10799.variants.weak_kahn_kalai
    at commit 9097e2f, with explicit constant C = 4 + 4/ε in the proof. The strong form (Kahn–Kalai Conjecture
