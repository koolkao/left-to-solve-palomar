automation:
  methods:
  - method: agent
    models:
    - Claude Opus 5.5
    framework: Claude Code
    tool_setup: >-
      Claude Code agents, directed by the owner, found the results, wrote the paper proofs, the Lean proofs, this
      Palomar port and this metadata. Other models contributed in brainstorms and refereeing (Claude Fable: the band
      construction of Theorem 9 and Propositions 9.4/9.5; Gemini 4 Neon: the proof idea of Theorem 7; Astra 6.2 and
      Gemini 4 Neon: independent reviews of the releases). The source repository was built with lake build on Lean
      v4.33.1; this entry was built with lake build and checked with lake comparator (Lean kernel, NanoDa, con-ron) on
      Lean v4.36.0 on macOS with its bwrap sandbox disabled, since bwrap is Linux-only.
    cost:
      wall_time: about two days of agent time (27-28 Nov 2026), plus about 1 h for this port
      spend_usd: subscription-based
      hardware: local machine
    prompting_notes: >-
      Goal-level instructions only: the owner chose the problem source (Left to Solve, Gillibert's conjectures), set
      the working rules (original proofs, no unlicensed reuse, credit known ingredients, machine-checked proofs with
      the standard axioms only, independent AI reviews before any public release) and asked the agents to work on the
      conjectures; the owner gave no mathematical hints.
  spend_usd: subscription-based
  notes: >-
    The owner directed the work at the level of goals and policy and did not write Lean or mathematics. Correctness
    rests on machine checking (lake build with the standard axioms only; Comparator for this entry). Statement
    faithfulness rests on the Challenge, which writes every notion out in Mathlib vocabulary and follows the source
    repository's independent restatement (Check.lean), and on the AI reviews of the source repository.
fidelity:
  divergences: >-
    The conjectures are stated by Gillibert for all connected vertex-transitive graphs; the theorems here add a
    hypothesis (an abelian or group labelling, a Cartesian product, or a generalized Petersen graph). The
    conclusions HasFairTraversal and HasGeodesicDeletion are written independently and are equivalent to the
    conclusions of #339/#334 (FairTraversal/Main.lean: hasFairTraversal_iff, hasGeodesicDeletion_iff). In the labelled forms #339/#334's vertex-transitivity hypothesis is kept although the
    labelling implies it. Theorem 8 writes the group Gamma(A, k, z) on A x Bool through its multiplication pwMul and
    inverse pwInv; the hypotheses k . k . a = a and k . z = z make it a group. In Theorem 2 the binders are Type* (more
    general than #334's Type) and no finiteness or vertex-transitivity is assumed. Theorem 6 allows infinite abelian
    groups.
