# formalization.yaml v0.4.
version: v0.4
project:
  name: Fair Traversal and Geodesic Deletion for Cayley graphs and generalized Petersen graphs (partial results on two conjectures of Gillibert)
  description: >-
    Lean 4 proofs of partial results on Gillibert's Fair Traversal Conjecture (every connected vertex-transitive
    graph with at least two vertices has a nonempty finite multiset of Hamiltonian paths covering every edge equally
    often) and Geodesic Deletion Conjecture (deleting the vertices of any geodesic of a connected vertex-transitive
    graph with at least three vertices leaves a connected graph). Fair Traversal is proved for connected Cayley graphs
    of finite abelian groups, Cartesian products, Cayley graphs of dihedral, dicyclic, generalized dihedral and
    generalized dicyclic groups and of index-2 power-map extensions Gamma(A, k, z) under condition (O), and for the
    generalized Petersen graphs GP(m, k) with k^2 = 1 (mod m), or k^2 = -1 (mod m) with m even, or GP(10, 2).
    Geodesic Deletion is proved for Cartesian products, connected Cayley graphs of finite abelian groups, and abelian
    Cayley graphs of degree at least six. Both conjectures remain open.
  authors:
  - Ming-Chih Kao
  license: Apache-2.0
  responsible_maintainers:
  - Ming-Chih Kao
classification:
  arxiv:
  - "math.CO"
  - "math.GR"
