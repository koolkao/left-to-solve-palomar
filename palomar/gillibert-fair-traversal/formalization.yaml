status:
  scope: >-
    The twelve theorems of Challenge.lean (Theorems 1, 2, 3, 5, 6, 7, 8 and 9 of the source repository, Theorem 1 and
    Theorem 5 also in the form of the Left to Solve statements with a labelling hypothesis added). Not claimed: the
    two conjectures; the paper-only results of the source repository (Theorem 1', Theorem 5', the sharper form of
    Theorem 8, Corollary 8' for abstract groups, Propositions 9.4 and 9.5 on the open case k^2 = -1 (mod m) with m odd).
    No axioms beyond propext, Classical.choice and Quot.sound (GP(10, 2) by ordinary kernel decide, no native_decide);
    the only sorries are the deliberate ones in Challenge.lean.
